name: Test Python Application

on:
  workflow_dispatch:  # Manual trigger
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * *'  # Daily at midnight UTC

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest
        pip install pytest-cov
        pip install -r requirements.txt
      shell: bash

    - name: Create test file
      run: |
        mkdir -p tests
        cat > tests/test_basic.py << 'EOF'
        def test_import():
            try:
                import src.main
                assert True
            except ImportError:
                assert False, "Failed to import main module"

        def test_version():
            from src.main import VERSION
            assert isinstance(VERSION, str)
            assert len(VERSION.split('.')) == 3

        def test_main_window():
            from src.main import MainWindow
            from PySide6 import QtWidgets
            app = QtWidgets.QApplication([])
            window = MainWindow()
            assert isinstance(window, QtWidgets.QMainWindow)
        EOF
      shell: bash

    - name: Run tests
      run: |
        python -m pytest -v --cov=src tests/
      shell: bash
      env:
        PYTHONPATH: ${{ github.workspace }}
        QT_QPA_PLATFORM: offscreen

    - name: Display test timestamp
      run: |
        echo "Tests completed at: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
        echo "Run by: ${{ github.actor }}"
      shell: bash
