# Update: install a matching cx-Freeze version explicitly on the Windows runner
name: Build Windows Executable

on:
  push:
    branches:
      - main
  workflow_dispatch:
  release:
    types: [published]

jobs:
  build-windows:
    name: Build Windows EXE (cx_Freeze)
    runs-on: windows-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies (without cx-Freeze)
        run: |
          python -m pip install -r requirements.txt || echo "requirements.txt may be missing or empty"
          # Install a specific, available cx-Freeze version only on the Windows runner:
          python -m pip install "cx-Freeze==6.15.16"

      - name: Run cx_Freeze build
        run: |
          python setup_cx_freeze.py build

      - name: Show build output (diagnostics)
        shell: pwsh
        run: |
          Write-Host "==== Listing repo root ===="
          Get-ChildItem -Force -Recurse -Depth 1 | ForEach-Object { Write-Host $_ }
          Write-Host "==== Listing 'build' directory (if exists) ===="
          if (Test-Path build) {
            Get-ChildItem -Path build -Recurse | ForEach-Object { Write-Host $_ }
          } else {
            Write-Host "No build directory found"
          }
          Write-Host "==== Python info ===="
          python -V
          python -m pip --version
          Write-Host "==== Installed packages (top 50) ===="
          python -m pip list --format=columns | Select-Object -First 50 | ForEach-Object { Write-Host $_ }

      - name: Compress and upload artifact
        shell: pwsh
        run: |
          $zipname = "time-machine-windows.zip"
          if (Test-Path build) {
            if (Test-Path $zipname) { Remove-Item $zipname -Force }
            Compress-Archive -Path build\* -DestinationPath $zipname -Force
            Write-Host "Created zip:" $zipname
          } else {
            Write-Error "Build folder not found. Build may have failed."
            exit 1
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: time-machine-windows
          path: time-machine-windows.zip
