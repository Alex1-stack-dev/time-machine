    - name: Build with PyInstaller
      run: |
        # Verify PyInstaller installation
        python -m pip install --upgrade pyinstaller
        
        # Verify Python environment
        python --version
        where python
        where pyinstaller
        
        # Create spec file
        $specContent = @"
        # -*- mode: python ; coding: utf-8 -*-

        block_cipher = None

        a = Analysis(
            ['src/main.py'],
            pathex=[],
            binaries=[],
            datas=[
                ('assets', 'assets'),
                ('src/timing', 'timing'),
                ('src/gui', 'gui'),
                ('src/reports', 'reports')
            ],
            hiddenimports=[],
            hookspath=[],
            hooksconfig={},
            runtime_hooks=[],
            excludes=[],
            win_no_prefer_redirects=False,
            win_private_assemblies=False,
            cipher=block_cipher,
            noarchive=False,
        )

        pyz = PYZ(a.pure, a.zipped_data, cipher=block_cipher)

        exe = EXE(
            pyz,
            a.scripts,
            a.binaries,
            a.zipfiles,
            a.datas,
            [],
            name='time-machine',
            debug=False,
            bootloader_ignore_signals=False,
            strip=False,
            upx=True,
            upx_exclude=[],
            runtime_tmpdir=None,
            console=False,
            disable_windowed_traceback=False,
            target_arch=None,
            codesign_identity=None,
            entitlements_file=None,
            icon='assets/icon.ico'
        )
"@ | Set-Content -Path time-machine.spec

        # Run PyInstaller with spec file
        python -m PyInstaller time-machine.spec
      shell: pwsh
