# Time Machine Build Workflow
# Last updated: 2025-10-29 21:33:01 UTC
# Repository: Alex1-stack-dev/time-machine
# Author: kuhafsoiusygdfouysd

name: Build Windows Executable

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number'
        required: true
        default: '0.1.0'

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller==5.14
        pip install PySide6==6.7.1
        pip install requests==2.31.0
        pip install pyserial==3.5
        pip install reportlab==4.0.7
        pip install psutil==5.9.8
        pip install pillow
        pip install pyyaml
      shell: cmd

    - name: Create Application Structure
      run: |
        mkdir src\timing
        mkdir src\gui
        mkdir src\reports
        mkdir assets
        
        echo import sys, os > src\main.py
        echo from PySide6 import QtWidgets, QtCore, QtGui >> src\main.py
        echo from pathlib import Path >> src\main.py
        echo VERSION = "${{ github.event.inputs.version }}" >> src\main.py
        echo. >> src\main.py
        echo class MainWindow(QtWidgets.QMainWindow): >> src\main.py
        echo     def __init__(self): >> src\main.py
        echo         super().__init__() >> src\main.py
        echo         self.setWindowTitle(f"Time Machine {VERSION}") >> src\main.py
        echo         self.resize(800, 600) >> src\main.py
        echo         self._setup_ui() >> src\main.py
        echo. >> src\main.py
        echo     def _setup_ui(self): >> src\main.py
        echo         self.central = QtWidgets.QWidget() >> src\main.py
        echo         self.setCentralWidget(self.central) >> src\main.py
        echo         layout = QtWidgets.QVBoxLayout(self.central) >> src\main.py
        echo. >> src\main.py
        echo def main(): >> src\main.py
        echo     app = QtWidgets.QApplication(sys.argv) >> src\main.py
        echo     window = MainWindow() >> src\main.py
        echo     window.show() >> src\main.py
        echo     sys.exit(app.exec()) >> src\main.py
        echo. >> src\main.py
        echo if __name__ == "__main__": >> src\main.py
        echo     main() >> src\main.py

        echo # Timing module > src\timing\__init__.py
        echo # GUI module > src\gui\__init__.py
        echo # Reports module > src\reports\__init__.py
      shell: cmd

    - name: Create PyInstaller Spec
      run: |
        echo # -*- mode: python -*- > time-machine.spec
        echo block_cipher = None >> time-machine.spec
        echo a = Analysis(['src/main.py'], >> time-machine.spec
        echo     pathex=[], >> time-machine.spec
        echo     binaries=[], >> time-machine.spec
        echo     datas=[('assets', 'assets'), ('src/timing', 'timing'), ('src/gui', 'gui'), ('src/reports', 'reports')], >> time-machine.spec
        echo     hiddenimports=['PySide6.QtCore', 'PySide6.QtGui', 'PySide6.QtWidgets', 'serial', 'reportlab', 'psutil'], >> time-machine.spec
        echo     hookspath=[], >> time-machine.spec
        echo     hooksconfig={}, >> time-machine.spec
        echo     runtime_hooks=[], >> time-machine.spec
        echo     excludes=[], >> time-machine.spec
        echo     win_no_prefer_redirects=False, >> time-machine.spec
        echo     win_private_assemblies=False, >> time-machine.spec
        echo     cipher=block_cipher, >> time-machine.spec
        echo     noarchive=False) >> time-machine.spec
        echo pyz = PYZ(a.pure, a.zipped_data, cipher=block_cipher) >> time-machine.spec
        echo exe = EXE(pyz, >> time-machine.spec
        echo     a.scripts, >> time-machine.spec
        echo     a.binaries, >> time-machine.spec
        echo     a.zipfiles, >> time-machine.spec
        echo     a.datas, >> time-machine.spec
        echo     [], >> time-machine.spec
        echo     name='time-machine', >> time-machine.spec
        echo     debug=False, >> time-machine.spec
        echo     bootloader_ignore_signals=False, >> time-machine.spec
        echo     strip=False, >> time-machine.spec
        echo     upx=True, >> time-machine.spec
        echo     upx_exclude=[], >> time-machine.spec
        echo     runtime_tmpdir=None, >> time-machine.spec
        echo     console=False, >> time-machine.spec
        echo     disable_windowed_traceback=False, >> time-machine.spec
        echo     target_arch=None) >> time-machine.spec
      shell: cmd

    - name: Build with PyInstaller
      run: pyinstaller time-machine.spec
      shell: cmd

    - name: Create Distribution Package
      run: |
        mkdir package
        mkdir package\assets
        copy dist\time-machine.exe package\
        
        echo {> package\config.json
        echo   "version": "${{ github.event.inputs.version }}",>> package\config.json
        echo   "build_date": "2025-10-29 21:33:01",>> package\config.json
        echo   "builder": "kuhafsoiusygdfouysd">> package\config.json
        echo }>> package\config.json
        
        echo # Time Machine Documentation> package\README.txt
        echo Version: ${{ github.event.inputs.version }}>> package\README.txt
        echo Built: 2025-10-29 21:33:01>> package\README.txt
        echo. >> package\README.txt
        echo Installation:>> package\README.txt
        echo 1. Extract all files>> package\README.txt
        echo 2. Run time-machine.exe>> package\README.txt
        echo. >> package\README.txt
        echo Required Files:>> package\README.txt
        echo - time-machine.exe>> package\README.txt
        echo - assets/ folder>> package\README.txt
        echo - config.json>> package\README.txt
      shell: cmd

    - name: Create ZIP
      run: powershell Compress-Archive package\* time-machine-${{ github.event.inputs.version }}-windows.zip
      shell: cmd

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: time-machine-${{ github.event.inputs.version }}
        path: time-machine-${{ github.event.inputs.version }}-windows.zip
        retention-days: 90
        Remove-Item -Path dist -Recurse -Force -ErrorAction SilentlyContinue
        Remove-Item -Path build -Recurse -Force -ErrorAction SilentlyContinue
        Remove-Item -Path dist-package -Recurse -Force -ErrorAction SilentlyContinue
        Write-Host "Cleanup completed"
      shell: pwsh
