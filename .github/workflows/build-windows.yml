name: Build Windows Executable

# Only manual triggers
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g., 1.0.0)'
        required: true
        default: '0.1.0'
      build_type:
        description: 'Build type'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug

jobs:
  build:
    runs-on: windows-latest

    permissions:
      contents: write
      actions: read

    env:
      BUILDER: kuhafsoiusygdfouysd
      BUILD_TIMESTAMP: '2025-10-29 21:28:59'
      BUILD_VERSION: ${{ github.event.inputs.version }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        architecture: 'x64'
        cache: 'pip'
        cache-dependency-path: 'requirements.txt'

    - name: Display Build Information
      run: |
        Write-Host "Build Information:"
        Write-Host "=================="
        Write-Host "Version: $env:BUILD_VERSION"
        Write-Host "Type: ${{ github.event.inputs.build_type }}"
        Write-Host "Builder: $env:BUILDER"
        Write-Host "Timestamp: $env:BUILD_TIMESTAMP"
        Write-Host "=================="
      shell: pwsh

    - name: Verify Directory Structure
      run: |
        $directories = @(
          "src/timing",
          "src/gui",
          "src/reports",
          "assets",
          "installer/wix"
        )
        
        foreach ($dir in $directories) {
          if (!(Test-Path $dir)) {
            New-Item -Path $dir -ItemType Directory -Force
            Write-Host "Created directory: $dir"
          } else {
            Write-Host "Directory exists: $dir"
          }
        }
      shell: pwsh

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
        # Verify PyInstaller installation
        python -m pip install --upgrade pyinstaller
        
        # Display installed packages
        pip list
      shell: pwsh

    - name: Create PyInstaller Spec
      run: |
        $specContent = @"
        # -*- mode: python ; coding: utf-8 -*-

        block_cipher = None

        a = Analysis(
            ['src/main.py'],
            pathex=[],
            binaries=[],
            datas=[
                ('assets', 'assets'),
                ('src/timing', 'timing'),
                ('src/gui', 'gui'),
                ('src/reports', 'reports')
            ],
            hiddenimports=['PySide6.QtCore', 'PySide6.QtGui', 'PySide6.QtWidgets'],
            hookspath=[],
            hooksconfig={},
            runtime_hooks=[],
            excludes=[],
            win_no_prefer_redirects=False,
            win_private_assemblies=False,
            cipher=block_cipher,
            noarchive=False,
        )

        pyz = PYZ(a.pure, a.zipped_data, cipher=block_cipher)

        exe = EXE(
            pyz,
            a.scripts,
            a.binaries,
            a.zipfiles,
            a.datas,
            [],
            name='time-machine',
            debug=${{ github.event.inputs.build_type == 'debug' }},
            bootloader_ignore_signals=False,
            strip=False,
            upx=True,
            upx_exclude=[],
            runtime_tmpdir=None,
            console=${{ github.event.inputs.build_type == 'debug' }},
            disable_windowed_traceback=False,
            target_arch=None,
            codesign_identity=None,
            entitlements_file=None,
            icon='assets/icon.ico',
            version='${{ github.event.inputs.version }}'
        )
"@ | Set-Content -Path time-machine.spec
        
        Get-Content time-machine.spec
      shell: pwsh

    - name: Build Executable
      run: |
        # Verify Python environment
        python --version
        where python
        where pyinstaller
        
        # Build with spec file
        python -m PyInstaller time-machine.spec
        
        # Verify build output
        if (!(Test-Path "dist/time-machine.exe")) {
          throw "Build failed: executable not found"
        }
        
        Write-Host "Build completed successfully"
      shell: pwsh

    - name: Create Distribution Package
      run: |
        # Create clean distribution directory
        Remove-Item -Path dist-package -Recurse -Force -ErrorAction SilentlyContinue
        New-Item -Path dist-package -ItemType Directory
        
        # Copy required files
        Copy-Item -Path "dist/time-machine.exe" -Destination "dist-package/"
        Copy-Item -Path "assets" -Destination "dist-package/" -Recurse
        Copy-Item -Path "README.md" -Destination "dist-package/"
        Copy-Item -Path "CHANGELOG.md" -Destination "dist-package/"
        
        # Create version info file
        @"
        Version: $env:BUILD_VERSION
        Build Type: ${{ github.event.inputs.build_type }}
        Build Date: $env:BUILD_TIMESTAMP
        Builder: $env:BUILDER
        "@ | Set-Content -Path "dist-package/version.txt"
      shell: pwsh

    - name: Create ZIP Archive
      run: |
        $zipName = "time-machine-$env:BUILD_VERSION-windows.zip"
        Compress-Archive -Path dist-package/* -DestinationPath $zipName
        
        # Output zip info
        $zipSize = (Get-Item $zipName).Length / 1MB
        Write-Host "Created ZIP archive: $zipName ($([math]::Round($zipSize, 2)) MB)"
      shell: pwsh

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: time-machine-${{ github.event.inputs.version }}
        path: time-machine-${{ github.event.inputs.version }}-windows.zip
        retention-days: 90
        if-no-files-found: error

    - name: Create Release
      if: github.event.inputs.build_type == 'release'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ github.event.inputs.version }}
        name: Time Machine v${{ github.event.inputs.version }}
        files: time-machine-${{ github.event.inputs.version }}-windows.zip
        body: |
          # Time Machine v${{ github.event.inputs.version }}
          
          Built on: ${{ env.BUILD_TIMESTAMP }}
          Builder: ${{ env.BUILDER }}
          
          ## Installation
          1. Download time-machine-${{ github.event.inputs.version }}-windows.zip
          2. Extract the contents
          3. Run time-machine.exe
          
          ## Auto-Updates
          - The application will automatically check for and install updates
          
          ## System Requirements
          - Windows 10 or later
          - 4GB RAM minimum
          - 500MB disk space
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Cleanup
      if: always()
      run: |
        Remove-Item -Path dist -Recurse -Force -ErrorAction SilentlyContinue
        Remove-Item -Path build -Recurse -Force -ErrorAction SilentlyContinue
        Remove-Item -Path dist-package -Recurse -Force -ErrorAction SilentlyContinue
        Write-Host "Cleanup completed"
      shell: pwsh
