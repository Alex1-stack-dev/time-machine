
name: Build Windows Executable

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number'
        required: true
        default: '0.1.0'

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller==5.14
        pip install PySide6==6.7.1
        pip install requests==2.31.0
        pip install pyserial==3.5
        pip install reportlab==4.0.7
        pip install psutil==5.9.8
        pip install pillow
        pip install pyyaml
      shell: cmd

    - name: Create Installation Files
      run: |
        mkdir package
        mkdir package\assets
        mkdir package\config
        mkdir package\database
        mkdir package\templates
        
        REM Create database directory for meet data
        echo {} > package\database\meets.json
        
        REM Create config files
        echo {> package\config\settings.json
        echo   "version": "${{ github.event.inputs.version }}",>> package\config\settings.json
        echo   "last_updated": "2025-10-29 21:40:47",>> package\config\settings.json
        echo   "g2_default_port": "COM1",>> package\config\settings.json
        echo   "database_path": "database/meets.json",>> package\config\settings.json
        echo   "auto_update": true>> package\config\settings.json
        echo }>> package\config\settings.json
        
        REM Create templates
        echo {> package\templates\meet_report.html
        echo   "title": "Meet Results Template",>> package\templates\meet_report.html
        echo   "version": "1.0">> package\templates\meet_report.html
        echo }>> package\templates\meet_report.html
        
        REM Create installation guide
        echo Time Machine Installation Guide> package\INSTALL.txt
        echo Version: ${{ github.event.inputs.version }}>> package\INSTALL.txt
        echo Built: 2025-10-29 21:40:47>> package\INSTALL.txt
        echo. >> package\INSTALL.txt
        echo Requirements:>> package\INSTALL.txt
        echo - Windows 10 or later>> package\INSTALL.txt
        echo - 4GB RAM minimum>> package\INSTALL.txt
        echo - USB port for G2 connection>> package\INSTALL.txt
        echo. >> package\INSTALL.txt
        echo Installation:>> package\INSTALL.txt
        echo 1. Extract ALL files maintaining directory structure>> package\INSTALL.txt
        echo 2. Run time-machine.exe>> package\INSTALL.txt
        echo 3. Configure G2 connection in settings>> package\INSTALL.txt
        echo. >> package\INSTALL.txt
        echo Directory Structure:>> package\INSTALL.txt
        echo - assets/: Required graphics and resources>> package\INSTALL.txt
        echo - config/: Program settings>> package\INSTALL.txt
        echo - database/: Meet data storage>> package\INSTALL.txt
        echo - templates/: Report templates>> package\INSTALL.txt
      shell: cmd

    - name: Build with PyInstaller
      run: |
        echo # -*- mode: python -*- > time-machine.spec
        echo from PyInstaller.utils.hooks import collect_data_files >> time-machine.spec
        echo block_cipher = None >> time-machine.spec
        echo a = Analysis(['src/main.py'], >> time-machine.spec
        echo     pathex=[], >> time-machine.spec
        echo     binaries=[], >> time-machine.spec
        echo     datas=[ >> time-machine.spec
        echo         ('assets', 'assets'), >> time-machine.spec
        echo         ('config', 'config'), >> time-machine.spec
        echo         ('database', 'database'), >> time-machine.spec
        echo         ('templates', 'templates'), >> time-machine.spec
        echo         ('src/timing', 'timing'), >> time-machine.spec
        echo         ('src/gui', 'gui'), >> time-machine.spec
        echo         ('src/reports', 'reports') >> time-machine.spec
        echo     ], >> time-machine.spec
        echo     hiddenimports=[ >> time-machine.spec
        echo         'PySide6.QtCore', >> time-machine.spec
        echo         'PySide6.QtGui', >> time-machine.spec
        echo         'PySide6.QtWidgets', >> time-machine.spec
        echo         'serial', >> time-machine.spec
        echo         'reportlab', >> time-machine.spec
        echo         'psutil', >> time-machine.spec
        echo         'yaml' >> time-machine.spec
        echo     ], >> time-machine.spec
        echo     hookspath=[], >> time-machine.spec
        echo     runtime_hooks=[], >> time-machine.spec
        echo     excludes=[], >> time-machine.spec
        echo     win_no_prefer_redirects=False, >> time-machine.spec
        echo     win_private_assemblies=False, >> time-machine.spec
        echo     cipher=block_cipher, >> time-machine.spec
        echo     noarchive=False) >> time-machine.spec
        echo pyz = PYZ(a.pure, a.zipped_data, cipher=block_cipher) >> time-machine.spec
        echo exe = EXE(pyz, >> time-machine.spec
        echo     a.scripts, >> time-machine.spec
        echo     a.binaries, >> time-machine.spec
        echo     a.zipfiles, >> time-machine.spec
        echo     a.datas, >> time-machine.spec
        echo     [], >> time-machine.spec
        echo     name='time-machine', >> time-machine.spec
        echo     debug=False, >> time-machine.spec
        echo     bootloader_ignore_signals=False, >> time-machine.spec
        echo     strip=False, >> time-machine.spec
        echo     upx=True, >> time-machine.spec
        echo     runtime_tmpdir=None, >> time-machine.spec
        echo     console=False, >> time-machine.spec
        echo     disable_windowed_traceback=False) >> time-machine.spec
        
        pyinstaller time-machine.spec
      shell: cmd

    - name: Create Complete Package
      run: |
        REM Create final package with all components
        mkdir complete-package
        copy dist\time-machine.exe complete-package\
        xcopy /E /I package\* complete-package\
        
        REM Create version marker
        echo ${{ github.event.inputs.version }}> complete-package\version.txt
        
        REM Add G2 driver info
        echo G2 Connection Setup> complete-package\G2_SETUP.txt
        echo 1. Connect G2 device via USB>> complete-package\G2_SETUP.txt
        echo 2. Note the COM port number>> complete-package\G2_SETUP.txt
        echo 3. Enter the COM port in settings>> complete-package\G2_SETUP.txt
        
        REM Create shortcut
        powershell "$ws = New-Object -ComObject WScript.Shell; $s = $ws.CreateShortcut('complete-package\Time Machine.lnk'); $s.TargetPath = 'complete-package\time-machine.exe'; $s.Save()"
      shell: cmd

    - name: Create Installation ZIP
      run: |
        powershell Compress-Archive complete-package\* TimeMachine-${{ github.event.inputs.version }}-Full.zip
      shell: cmd

    - name: Upload Package
      uses: actions/upload-artifact@v4
      with:
        name: TimeMachine-${{ github.event.inputs.version }}-Full
        path: TimeMachine-${{ github.event.inputs.version }}-Full.zip
        retention-days: 90
