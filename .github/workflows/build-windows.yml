
name: Build Windows Executable

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number'
        required: true
        default: '0.1.0'

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        architecture: 'x64'

    - name: Create Basic File Structure
      run: |
        mkdir src
        mkdir src\timing
        mkdir src\gui
        mkdir src\reports
        mkdir assets
        mkdir config
        mkdir database
        mkdir templates
      shell: cmd

    - name: Create Main Python File
      run: |
        echo import sys > src\main.py
        echo from PySide6 import QtWidgets >> src\main.py
        echo. >> src\main.py
        echo VERSION = "${{ github.event.inputs.version }}" >> src\main.py
        echo. >> src\main.py
        echo class MainWindow(QtWidgets.QMainWindow): >> src\main.py
        echo     def __init__(self): >> src\main.py
        echo         super().__init__() >> src\main.py
        echo         self.setWindowTitle("Time Machine " + VERSION) >> src\main.py
        echo         self.resize(800, 600) >> src\main.py
        echo. >> src\main.py
        echo def main(): >> src\main.py
        echo     app = QtWidgets.QApplication(sys.argv) >> src\main.py
        echo     window = MainWindow() >> src\main.py
        echo     window.show() >> src\main.py
        echo     sys.exit(app.exec()) >> src\main.py
        echo. >> src\main.py
        echo if __name__ == "__main__": >> src\main.py
        echo     main() >> src\main.py
      shell: cmd

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install pyinstaller==5.13.2
        python -m pip install PySide6==6.5.2
      shell: cmd

    - name: Verify PyInstaller
      run: |
        python -m PyInstaller --version
      shell: cmd

    - name: Create Basic Spec File
      run: |
        echo # -*- mode: python -*- > time-machine.spec
        echo block_cipher = None >> time-machine.spec
        echo a = Analysis(['src/main.py'], >> time-machine.spec
        echo     pathex=[], >> time-machine.spec
        echo     binaries=[], >> time-machine.spec
        echo     datas=[], >> time-machine.spec
        echo     hiddenimports=['PySide6.QtCore', 'PySide6.QtGui', 'PySide6.QtWidgets'], >> time-machine.spec
        echo     hookspath=[], >> time-machine.spec
        echo     hooksconfig={}, >> time-machine.spec
        echo     runtime_hooks=[], >> time-machine.spec
        echo     excludes=[], >> time-machine.spec
        echo     win_no_prefer_redirects=False, >> time-machine.spec
        echo     win_private_assemblies=False, >> time-machine.spec
        echo     cipher=block_cipher, >> time-machine.spec
        echo     noarchive=False) >> time-machine.spec
        echo pyz = PYZ(a.pure, a.zipped_data, cipher=block_cipher) >> time-machine.spec
        echo exe = EXE(pyz, >> time-machine.spec
        echo     a.scripts, >> time-machine.spec
        echo     a.binaries, >> time-machine.spec
        echo     a.zipfiles, >> time-machine.spec
        echo     a.datas, >> time-machine.spec
        echo     [], >> time-machine.spec
        echo     name='time-machine', >> time-machine.spec
        echo     debug=False, >> time-machine.spec
        echo     bootloader_ignore_signals=False, >> time-machine.spec
        echo     strip=False, >> time-machine.spec
        echo     upx=True, >> time-machine.spec
        echo     runtime_tmpdir=None, >> time-machine.spec
        echo     console=False, >> time-machine.spec
        echo     disable_windowed_traceback=False) >> time-machine.spec
      shell: cmd

    - name: Build with PyInstaller
      run: |
        python -m PyInstaller time-machine.spec
      shell: cmd

    - name: Verify Build
      run: |
        if not exist "dist\time-machine.exe" (
          echo "Build failed: executable not found"
          exit 1
        )
      shell: cmd

    - name: Create Package
      run: |
        mkdir package
        copy dist\time-machine.exe package\
        echo Version: ${{ github.event.inputs.version }} > package\version.txt
      shell: cmd

    - name: Create ZIP
      run: powershell Compress-Archive package\* time-machine-${{ github.event.inputs.version }}.zip
      shell: cmd

    - name: Upload Build
      uses: actions/upload-artifact@v4
      with:
        name: time-machine-${{ github.event.inputs.version }}
        path: time-machine-${{ github.event.inputs.version }}.zip
        retention-days: 90
