name: Build Windows Executable

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        architecture: 'x64'

    - name: Create Directory Structure
      run: |
        mkdir -p src/timing
        mkdir -p src/gui
        mkdir -p src/reports
        mkdir -p assets
        mkdir -p installer/wix

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        # Additional dependencies for G2 integration
        pip install pyserial
        pip install reportlab
        pip install psutil
        pip install packaging

    - name: Update requirements.txt
      run: |
        echo "pyinstaller==5.14" > requirements.txt
        echo "PySide6==6.7.1" >> requirements.txt
        echo "requests==2.31.0" >> requirements.txt
        echo "packaging==24.0" >> requirements.txt
        echo "pyserial==3.5" >> requirements.txt
        echo "reportlab==4.0.7" >> requirements.txt
        echo "psutil==5.9.8" >> requirements.txt

    - name: Generate Assets
      run: |
        python src/assets/generate_full_assets.py

    - name: Build with PyInstaller
      run: |
        pyinstaller --noconfirm --onefile --windowed `
          --add-data "assets;assets" `
          --add-data "src/timing;timing" `
          --add-data "src/gui;gui" `
          --add-data "src/reports;reports" `
          --icon "assets/icon.ico" `
          --name time-machine `
          src/main.py

    - name: Create Distribution Directory
      run: |
        mkdir dist-package
        copy dist\time-machine.exe dist-package\
        copy assets\* dist-package\
        copy README.md dist-package\
        copy CHANGELOG.md dist-package\

    - name: Create ZIP archive
      run: |
        Compress-Archive -Path dist-package\* -DestinationPath time-machine-windows.zip

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4  # Updated from v3 to v4
      with:
        name: time-machine-windows
        path: time-machine-windows.zip
        retention-days: 90  # Specify how long to keep the artifact

    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2  # Updated to use more modern release action
      with:
        files: time-machine-windows.zip
        name: Release ${{ github.ref_name }}
        body: |
          Time Machine ${{ github.ref_name }}
          
          This release includes:
          - Automatic updates
          - G2 integration
          - Enhanced error handling
          - Multiple export formats
          
          Installation:
          1. Download time-machine-windows.zip
          2. Extract the contents
          3. Run time-machine.exe
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

permissions:
  contents: write  # Required for creating releases
  actions: read    # Required for workflow
